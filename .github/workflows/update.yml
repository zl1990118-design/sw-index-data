name: SW Index Daily Update

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30，周一至周五
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run daily update
        run: python sw_daily_update.py

      - name: Commit and push
        run: |
          git config user.name "sw-index-bot"
          git config user.email "sw-index-bot@users.noreply.github.com"
          git add -A
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily sw index update $(date +%Y-%m-%d)"
            git push
          fi
